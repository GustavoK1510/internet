<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 6</title>
</head>
<body>
    <input type="number" id="inicio" placeholder="Início">
    <input type="number" id="fim" placeholder="Fim">
    <button onclick="verificarPrimos()">Verificar</button>
    <p id="resultado"></p>
    
    <script>
        function ehPrimo(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function verificarPrimos() {
            let inicio = parseInt(document.getElementById("inicio").value);
            let fim = parseInt(document.getElementById("fim").value);
            const resultado = document.getElementById("resultado");

            if (isNaN(inicio) || isNaN(fim)) {
                resultado.innerHTML = "Insira dois números válidos.";
                return;
            }

            if (inicio > fim) {
                [inicio, fim] = [fim, inicio];
            }

            let primos = [];
            for (let i = inicio; i <= fim; i++) {
                if (ehPrimo(i)) {
                    primos.push(i);
                }
            }

            if (primos.length === 0) {
                resultado.innerHTML = `Não há números primos entre ${inicio} e ${fim}.`;
            } else {
                resultado.innerHTML = `Os números primos entre ${inicio} e ${fim} são: <br> ${primos.join(", ")}`;
            }
        }
    </script>
</body>
</html>
